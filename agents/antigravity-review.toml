# 由 review-loop 读取并传入 Antigravity 的 define_subagent / invoke_subagent 工具；
# 不是 Antigravity 原生 agent 注册配置。
# 平台能力约束：
#   - invoke_subagent 仅支持 Model 档位（inherit / flash_lite / flash / pro），无独立 reasoning_effort 参数。
#   - 主会话直接并行起 reviewer 并负责汇总，不设独立 orchestrator 角色。
#   - 普通 reviewer 跟随主会话模型（inherit），重档深审（角度 ⑤）固定 pro。
#   - define_subagent 将 EnableWriteTools 与 EnableSubagentTools 均设为 false（结构性只读、
#     禁止再扇出且无 shell，由主会话预采集 git status/diff 及重档 git log 快照供子 agent 用绝对路径核对）。
# 改本文件即改审查强度，按 /review-loop 的规则审查。

[reviewer]
model = "inherit"

[deep_reviewer]
model = "pro"
