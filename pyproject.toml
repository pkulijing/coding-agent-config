[project]
name = "coding-agent-config"
version = "0.0.0"
description = "Personal Coding Agent harness test and check environment"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
    "websockets==15.0.1",
]

[tool.uv]
package = false
python-preference = "only-managed"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
